<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0d18">
<title>墨魂·江湖 — Dify 版模拟器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --bg-primary: #0d0d18; --bg-secondary: #15152a; --bg-card: #1e1e3a; --bg-card-hover: #26264a;
  --text-primary: #e8dcc8; --text-secondary: #9e8c6a; --text-muted: #6b5d45;
  --accent-gold: #d4a853; --accent-red: #c0392b; --accent-green: #27ae60;
  --accent-blue: #2980b9; --accent-purple: #8e44ad; --border-color: #3a3352;
  --danger: #e74c3c; --success: #2ecc71; --warning: #f39c12;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg-primary); color: var(--text-primary);
  min-height: 100vh; font-size: 15px; line-height: 1.6;
}
.app { max-width: 900px; margin: 0 auto; padding: 12px; padding-bottom: 100px; }

/* 顶部 */
.header {
  position: sticky; top: 0; z-index: 100; background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color); padding: 12px 16px;
  display: flex; justify-content: space-between; align-items: center; margin: -12px -12px 12px;
}
.header h1 {
  font-size: 17px; letter-spacing: 1px;
  background: linear-gradient(135deg, var(--accent-gold), #f0d78c);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.header .badge {
  font-size: 10px; background: rgba(142,68,173,0.2); color: #a855f7;
  padding: 3px 8px; border-radius: 10px; border: 1px solid rgba(142,68,173,0.3);
}

/* 配置区 */
.config-bar {
  background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px;
  padding: 12px; margin-bottom: 12px; display: none;
}
.config-bar.show { display: block; }
.config-bar .row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.config-bar input, .config-bar select {
  flex: 1; min-width: 120px; padding: 8px 10px; background: var(--bg-primary);
  border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-primary);
  font-size: 13px; font-family: inherit;
}
.config-bar input:focus, .config-bar select:focus { outline: none; border-color: var(--accent-gold); }
.config-bar label { font-size: 11px; color: var(--text-secondary); display: block; margin-bottom: 3px; }
.config-bar .preset-btn {
  padding: 6px 10px; background: var(--bg-primary); border: 1px solid var(--border-color);
  border-radius: 6px; color: var(--text-secondary); font-size: 12px; cursor: pointer;
}
.config-bar .preset-btn.active { border-color: var(--accent-gold); color: var(--accent-gold); }
.config-bar .test-btn {
  padding: 8px 14px; background: var(--accent-blue); color: white; border: none;
  border-radius: 6px; font-size: 12px; cursor: pointer;
}

/* 设置按钮 */
.settings-toggle {
  background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px;
  padding: 6px 12px; color: var(--text-secondary); font-size: 13px; cursor: pointer;
}

/* 卡片 */
.card {
  background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px;
  padding: 16px; margin-bottom: 12px;
}
.card h3 {
  font-size: 14px; color: var(--accent-gold); margin-bottom: 10px;
  display: flex; align-items: center; gap: 6px;
}

/* 输入 */
.input-group { display: flex; gap: 8px; margin-bottom: 12px; }
.input-group input {
  flex: 1; padding: 12px; background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: 8px; color: var(--text-primary); font-size: 14px; font-family: inherit;
}
.input-group input:focus { outline: none; border-color: var(--accent-gold); }
.btn {
  padding: 12px 20px; background: linear-gradient(135deg, var(--accent-gold), #b8860b);
  color: #1a1a1a; border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
  cursor: pointer; white-space: nowrap;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary {
  background: var(--bg-card); color: var(--text-secondary); border: 1px solid var(--border-color);
}

/* 耗时面板（Dify版核心卖点） */
.timeline-panel {
  background: linear-gradient(135deg, rgba(142,68,173,0.08), rgba(41,128,185,0.08));
  border: 1px solid rgba(142,68,173,0.3); border-radius: 12px; padding: 14px; margin-bottom: 12px;
}
.timeline-panel h3 { color: #a855f7; font-size: 13px; margin-bottom: 10px; }
.timeline-bar {
  display: flex; gap: 4px; height: 32px; border-radius: 6px; overflow: hidden; margin-bottom: 8px;
  background: var(--bg-primary);
}
.timeline-seg {
  display: flex; align-items: center; justify-content: center; font-size: 10px; color: white;
  transition: width 0.5s; min-width: 30px;
}
.seg-world { background: var(--accent-green); }
.seg-heavenly { background: var(--accent-purple); }
.seg-canon { background: var(--accent-blue); }
.seg-merge { background: var(--warning); }
.seg-narrator { background: var(--accent-gold); color: #1a1a1a; }
.timeline-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; }
.timeline-legend span { display: flex; align-items: center; gap: 4px; }
.timeline-legend .dot { width: 8px; height: 8px; border-radius: 50%; }
.timeline-stats {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; margin-top: 10px;
}
.stat-box {
  background: var(--bg-primary); padding: 8px; border-radius: 6px; text-align: center;
}
.stat-box .label { font-size: 10px; color: var(--text-muted); }
.stat-box .value { font-size: 16px; font-weight: 700; color: var(--accent-gold); }
.parallel-note {
  font-size: 11px; color: var(--success); margin-top: 8px; padding: 6px 10px;
  background: rgba(39,174,96,0.1); border-radius: 6px;
}

/* 模块输出 */
.module {
  background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px;
  overflow: hidden; margin-bottom: 8px;
}
.module-header {
  padding: 10px 14px; display: flex; justify-content: space-between; align-items: center;
  cursor: pointer; user-select: none;
}
.module-header:hover { background: rgba(255,255,255,0.02); }
.module-title { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.module-arrow { color: var(--text-muted); transition: transform 0.2s; font-size: 11px; }
.module.collapsed .module-arrow { transform: rotate(-90deg); }
.module.collapsed .module-body { display: none; }
.module-body { padding: 12px 14px; border-top: 1px solid var(--border-color); font-size: 14px; line-height: 1.8; }
.module-body pre {
  background: var(--bg-primary); padding: 10px; border-radius: 6px; font-size: 11px;
  color: var(--text-secondary); overflow-x: auto; white-space: pre-wrap; word-break: break-all;
  font-family: "SF Mono", Consolas, monospace;
}
.module-plot {
  background: linear-gradient(180deg, rgba(30,30,58,0.8), var(--bg-card));
  border: 1px solid var(--border-color); border-radius: 10px; padding: 14px;
  font-size: 14px; line-height: 1.9; margin-bottom: 8px;
}
.module-plot .label { font-size: 11px; color: var(--accent-gold); margin-bottom: 6px; font-weight: 600; }

/* 工具调用记录 */
.tool-log {
  background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 6px;
  padding: 10px; font-family: "SF Mono", Consolas, monospace; font-size: 11px;
  color: var(--text-secondary); white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow-y: auto;
}

/* 状态 */
.loading {
  display: flex; align-items: center; justify-content: center; padding: 30px;
  color: var(--text-muted); font-size: 13px; flex-direction: column; gap: 12px;
}
.spinner {
  width: 24px; height: 24px; border: 2px solid var(--border-color); border-top-color: var(--accent-gold);
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.error-msg {
  background: rgba(231,76,60,0.1); border: 1px solid var(--danger); border-radius: 8px;
  padding: 12px; color: var(--danger); font-size: 13px; margin-bottom: 12px;
}

.init-output {
  background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px;
  padding: 16px; white-space: pre-wrap; line-height: 1.8; font-size: 14px;
}

/* 输入栏 */
.input-bar {
  position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-secondary);
  border-top: 1px solid var(--border-color); padding: 10px 12px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 100;
}
.input-bar .inner { max-width: 900px; margin: 0 auto; display: flex; gap: 8px; }
.input-bar input {
  flex: 1; padding: 12px 16px; background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: 22px; color: var(--text-primary); font-size: 14px; outline: none; font-family: inherit;
}
.input-bar input:focus { border-color: var(--accent-gold); }
.send-btn {
  width: 44px; height: 44px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-gold), #b8860b); color: #1a1a1a;
  border: none; font-size: 18px; cursor: pointer; flex-shrink: 0;
}
.send-btn:active { transform: scale(0.9); }
.send-btn:disabled { opacity: 0.5; }

/* 响应式 */
@media (max-width: 600px) {
  .header h1 { font-size: 15px; }
  .config-bar .row { flex-direction: column; }
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>🎭 墨魂·江湖 <span class="badge">Dify 三角色并行版</span></h1>
    <button class="settings-toggle" onclick="toggleConfig()">⚙️ LLM 配置</button>
  </div>

  <!-- 配置区 -->
  <div class="config-bar" id="configBar">
    <div class="row">
      <div style="flex:1; min-width:200px;">
        <label>Base URL</label>
        <input id="baseURL" placeholder="https://open.bigmodel.cn/api/paas/v4" value="https://open.bigmodel.cn/api/paas/v4">
      </div>
      <div style="flex:1; min-width:120px;">
        <label>模型名</label>
        <input id="model" placeholder="glm-4.5-air" value="glm-4.5-air">
      </div>
    </div>
    <div class="row">
      <div style="flex:1;">
        <label>API Key</label>
        <input id="apiKey" type="password" placeholder="sk-...">
      </div>
    </div>
    <div class="row">
      <button class="preset-btn active" onclick="setPreset('glm', this)">智谱 GLM</button>
      <button class="preset-btn" onclick="setPreset('deepseek', this)">DeepSeek</button>
      <button class="preset-btn" onclick="setPreset('doubao', this)">豆包</button>
      <button class="preset-btn" onclick="setPreset('openai', this)">OpenAI</button>
      <button class="preset-btn" onclick="setPreset('ollama', this)">Ollama本地</button>
      <button class="test-btn" onclick="testConn()">测试连接</button>
    </div>
    <div style="font-size:11px; color:var(--text-muted); margin-top:6px;">
      提示：GLM 模型名用 glm-4.5-air（带横线）；API Key 存浏览器 localStorage，不上传服务器。
    </div>
  </div>

  <!-- 初始化区 -->
  <div class="card" id="initCard">
    <h3>📖 第一步：选择小说</h3>
    <div class="input-group">
      <input id="novelInput" placeholder="输入小说名称，如：射雕英雄传" onkeydown="if(event.key==='Enter')initGame()">
      <button class="btn" onclick="initGame()">世界初始化</button>
    </div>
    <div style="font-size:11px; color:var(--text-muted);">
      内置推荐：射雕英雄传 / 神雕侠侣 / 倚天屠龙记 / 三国演义 / 西游记 / 水浒传
    </div>
  </div>

  <!-- 初始化输出 -->
  <div id="initOutput" style="display:none;"></div>

  <!-- 耗时面板 -->
  <div id="timelinePanel" style="display:none;"></div>

  <!-- 工具调用记录 -->
  <div id="toolLogPanel" style="display:none;"></div>

  <!-- 游戏输出区 -->
  <div id="gameOutput"></div>

  <!-- 错误 -->
  <div id="errorArea"></div>
</div>

<!-- 输入栏 -->
<div class="input-bar" id="inputBar" style="display:none;">
  <div class="inner">
    <input id="actionInput" placeholder="描述你的行动，如：我向店小二打听消息" onkeydown="if(event.key==='Enter')sendAction()">
    <button class="send-btn" onclick="sendAction()">▶</button>
  </div>
</div>

<script>
// ============ 状态 ============
let gameState = {
  novel_name: "",
  game_phase: "not_started",
  player_state: {},
  world_time: {"年":"","月":"","日":1,"时辰":"辰时"},
  round_count: 0,
  game_log: []
};
let isLoading = false;

// ============ 预设 ============
const PRESETS = {
  glm: { baseURL: "https://open.bigmodel.cn/api/paas/v4", model: "glm-4.5-air" },
  deepseek: { baseURL: "https://api.deepseek.com/v1", model: "deepseek-chat" },
  doubao: { baseURL: "https://ark.cn-beijing.volces.com/api/v3", model: "doubao-pro-32k" },
  openai: { baseURL: "https://api.openai.com/v1", model: "gpt-4o" },
  ollama: { baseURL: "http://localhost:11434/v1", model: "qwen2.5:14b" }
};

function setPreset(key, btn) {
  const p = PRESETS[key];
  document.getElementById("baseURL").value = p.baseURL;
  document.getElementById("model").value = p.model;
  document.querySelectorAll(".preset-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
}

function getConfig() {
  return {
    baseURL: document.getElementById("baseURL").value,
    apiKey: document.getElementById("apiKey").value,
    model: document.getElementById("model").value
  };
}

// ============ 加载/保存配置 ============
function saveConfig() {
  localStorage.setItem("dify_sim_config", JSON.stringify(getConfig()));
}
function loadConfig() {
  const saved = localStorage.getItem("dify_sim_config");
  if (saved) {
    const c = JSON.parse(saved);
    document.getElementById("baseURL").value = c.baseURL || "";
    document.getElementById("model").value = c.model || "";
    document.getElementById("apiKey").value = c.apiKey || "";
  }
}
loadConfig();

function toggleConfig() {
  document.getElementById("configBar").classList.toggle("show");
}

// ============ 测试连接 ============
async function testConn() {
  saveConfig();
  const cfg = getConfig();
  if (!cfg.apiKey) { alert("请填 API Key"); return; }
  const btn = event.target;
  btn.textContent = "测试中...";
  btn.disabled = true;
  try {
    const resp = await fetch("/api/action", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        config: cfg,
        user_input: "测试：请回复'连接成功'四个字",
        state: gameState
      })
    });
    const data = await resp.json();
    if (data.narrator_error) {
      alert("连接失败：" + data.narrator_error);
    } else {
      alert("✓ 连接成功！模型：" + cfg.model);
    }
  } catch(e) {
    alert("请求失败：" + e.message);
  }
  btn.textContent = "测试连接";
  btn.disabled = false;
}

// ============ 世界初始化 ============
async function initGame() {
  saveConfig();
  const cfg = getConfig();
  const novel = document.getElementById("novelInput").value.trim();
  if (!novel) { alert("请输入小说名称"); return; }
  if (!cfg.apiKey) { alert("请先配置 API Key"); toggleConfig(); return; }

  gameState.novel_name = novel;
  gameState.game_phase = "initializing";
  isLoading = true;

  const out = document.getElementById("initOutput");
  out.style.display = "block";
  out.innerHTML = '<div class="loading"><div class="spinner"></div><div>正在初始化《' + novel + '》世界...<br>首字延迟取决于 LLM 响应速度，通常 5-20 秒</div></div>';

  try {
    const resp = await fetch("/api/init", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ config: cfg, novel_name: novel })
    });
    const data = await resp.json();
    if (data.error) {
      out.innerHTML = '<div class="error-msg">' + data.error + '</div>';
    } else {
      out.innerHTML = '<div class="init-output">' + data.text + '</div><div style="font-size:11px;color:var(--text-muted);margin-top:8px;">耗时：' + data.elapsed + ' 秒</div>';
      gameState.game_phase = "playing";
      document.getElementById("inputBar").style.display = "block";
      document.getElementById("actionInput").focus();
    }
  } catch(e) {
    out.innerHTML = '<div class="error-msg">请求失败：' + e.message + '</div>';
  }
  isLoading = false;
}

// ============ 玩家行动 ============
async function sendAction() {
  if (isLoading) return;
  saveConfig();
  const cfg = getConfig();
  const input = document.getElementById("actionInput").value.trim();
  if (!input) return;

  isLoading = true;
  document.getElementById("actionInput").value = "";
  const sendBtn = document.querySelector(".send-btn");
  sendBtn.disabled = true;

  const gameOut = document.getElementById("gameOutput");
  // 显示玩家输入
  const userTurn = document.createElement("div");
  userTurn.className = "card";
  userTurn.innerHTML = '<h3>🧑 玩家（轮次' + (gameState.round_count + 1) + '）</h3><div style="padding:4px 0;">' + escapeHtml(input) + '</div>';
  gameOut.appendChild(userTurn);

  // 显示加载
  const loadingDiv = document.createElement("div");
  loadingDiv.className = "loading";
  loadingDiv.id = "loadingDiv";
  loadingDiv.innerHTML = '<div class="spinner"></div><div>三角色并行推演中...<br>A 世界推演 / B 原著校验 / C 天道判定 同时进行</div>';
  gameOut.appendChild(loadingDiv);

  // 滚动到底
  loadingDiv.scrollIntoView({ behavior: "smooth" });

  try {
    const resp = await fetch("/api/action", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ config: cfg, user_input: input, state: gameState })
    });
    const data = await resp.json();

    loadingDiv.remove();

    if (data.narrator_error && !data.narrator_text) {
      const errDiv = document.createElement("div");
      errDiv.className = "error-msg";
      errDiv.textContent = "生成失败：" + data.narrator_error;
      gameOut.appendChild(errDiv);
    } else {
      // 渲染耗时面板
      renderTimeline(data);

      // 渲染工具调用记录
      renderToolLog(data);

      // 解析并渲染 10 模块
      renderModules(data.narrator_text);

      // 更新状态
      gameState.round_count += 1;
    }
  } catch(e) {
    loadingDiv.remove();
    const errDiv = document.createElement("div");
    errDiv.className = "error-msg";
    errDiv.textContent = "请求失败：" + e.message;
    gameOut.appendChild(errDiv);
  }

  isLoading = false;
  sendBtn.disabled = false;
  document.getElementById("actionInput").focus();
}

// ============ 渲染耗时面板（Dify 版核心可视化）============
function renderTimeline(data) {
  const tl = data.timeline || {};
  const par = data.parallel || {};
  const total = tl.total || 0;
  const parTime = tl.parallel || 0;
  const mergeTime = tl.merge || 0;
  const narTime = tl.narrator || 0;

  // 并行耗时 vs 串行耗时的对比
  const串行耗时 = (par.world?.elapsed || 0) + (par.heavenly?.elapsed || 0) + (par.canon?.elapsed || 0);
  const 节省 = (串行耗时 - parTime).toFixed(2);

  const panel = document.getElementById("timelinePanel");
  panel.style.display = "block";
  panel.className = "timeline-panel";
  panel.innerHTML = `
    <h3>⚡ 三角色并行执行耗时</h3>
    <div class="timeline-bar">
      <div class="timeline-seg seg-world" style="flex:${parTime}" title="并行阶段 ${parTime}s">并行 ${parTime}s</div>
      <div class="timeline-seg seg-merge" style="flex:${Math.max(mergeTime,0.05)}" title="合并 ${mergeTime}s">合并 ${mergeTime}s</div>
      <div class="timeline-seg seg-narrator" style="flex:${narTime}" title="叙事 ${narTime}s">叙事 ${narTime}s</div>
    </div>
    <div class="timeline-legend">
      <span><span class="dot" style="background:var(--accent-green)"></span>A世界推演 ${par.world?.elapsed||0}s</span>
      <span><span class="dot" style="background:var(--accent-purple)"></span>C天道 ${par.heavenly?.elapsed||0}s</span>
      <span><span class="dot" style="background:var(--accent-blue)"></span>B原著校验 ${par.canon?.elapsed||0}s</span>
      <span><span class="dot" style="background:var(--warning)"></span>合并工具 ${mergeTime}s</span>
      <span><span class="dot" style="background:var(--accent-gold)"></span>叙事生成 ${narTime}s</span>
    </div>
    <div class="timeline-stats">
      <div class="stat-box"><div class="label">总耗时</div><div class="value">${total}s</div></div>
      <div class="stat-box"><div class="label">并行阶段</div><div class="value">${parTime}s</div></div>
      <div class="stat-box"><div class="label">工具调用</div><div class="value">${data.tool_count||0}次</div></div>
    </div>
    <div class="parallel-note">⚡ 并行节省：串行需 ${串行耗时.toFixed(2)}s，并行仅 ${parTime}s，节省 ${节省}s</div>
  `;
  panel.scrollIntoView({ behavior: "smooth" });
}

// ============ 渲染工具调用记录 ============
function renderToolLog(data) {
  const panel = document.getElementById("toolLogPanel");
  panel.style.display = "block";
  panel.className = "module";
  panel.innerHTML = `
    <div class="module-header" onclick="this.parentElement.classList.toggle('collapsed')">
      <div class="module-title">🔧 工具调用记录（${data.tool_count||0}次，Code 节点真函数执行）</div>
      <div class="module-arrow">▼</div>
    </div>
    <div class="module-body">
      <div class="tool-log">${escapeHtml(data.exec_log || "无工具调用")}</div>
    </div>
  `;
}

// ============ 解析 10 模块并渲染 ============
function renderModules(text) {
  const gameOut = document.getElementById("gameOutput");
  const wrapper = document.createElement("div");
  wrapper.style.marginTop = "12px";

  // 拆分模块
  const pattern = /(?:━+|─+|={3,}|#+)?\s*模块\s*(\d+)\s*【([^】]+)】\s*([\s\S]*?)(?=(?:━+|─+|={3,}|#+)?\s*模块\s*\d+\s*【|$)/g;
  let match;
  let hasModule = false;
  const modules = [];

  while ((match = pattern.exec(text)) !== null) {
    modules.push({
      num: parseInt(match[1]),
      title: match[2],
      content: match[3].trim()
    });
    hasModule = true;
  }

  if (!hasModule) {
    // 没解析到模块，直接显示原文
    const div = document.createElement("div");
    div.className = "module-plot";
    div.innerHTML = '<div class="label">叙事输出</div>' + escapeHtml(text);
    wrapper.appendChild(div);
    gameOut.appendChild(wrapper);
    wrapper.scrollIntoView({ behavior: "smooth" });
    return;
  }

  // A 类纯文本模块（1,3,6,10）直接展示
  // B 类 JSON 模块（2,4,5,7,8,9）折叠
  const textModules = [1, 3, 6, 10];
  const jsonModules = [2, 4, 5, 7, 8, 9];

  modules.forEach(m => {
    if (textModules.includes(m.num)) {
      // 纯文本模块
      const div = document.createElement("div");
      div.className = "module-plot";
      div.innerHTML = '<div class="label">模块' + m.num + '【' + m.title + '】</div>' + escapeHtml(m.content);
      wrapper.appendChild(div);
    } else if (jsonModules.includes(m.num)) {
      // JSON 模块，折叠
      const div = document.createElement("div");
      div.className = "module collapsed";
      div.innerHTML = `
        <div class="module-header" onclick="this.parentElement.classList.toggle('collapsed')">
          <div class="module-title">模块${m.num}【${m.title}】</div>
          <div class="module-arrow">▼</div>
        </div>
        <div class="module-body"><pre>${escapeHtml(m.content)}</pre></div>
      `;
      wrapper.appendChild(div);
    }
  });

  gameOut.appendChild(wrapper);
  wrapper.scrollIntoView({ behavior: "smooth" });
}

// ============ 工具函数 ============
function escapeHtml(str) {
  if (!str) return "";
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
            .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
